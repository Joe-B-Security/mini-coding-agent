[package]
name = "rust_hook"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated hook binding for mini-coding-agent Part 4"

[lib]
name = "rust_hook"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
regex = "1"
once_cell = "1"
tree-sitter = "0.22"
tree-sitter-bash = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
